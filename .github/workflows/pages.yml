name: Publish Reklumo landing

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public files
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/favicon.svg assets/green-mug.png \
            assets/coffee.png assets/fitness.png assets/language.png \
            assets/coffee-takeaway.png assets/fitness-coach.png \
            assets/inter.ttf assets/manrope.ttf \
            assets/inter-license.txt assets/manrope-license.txt _site/assets/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
